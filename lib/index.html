<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --flutter-blue: #0553B1;
            --flutter-light-blue: #027DFD;
            --flutter-yellow: #FFDE59;
            --flutter-green: #28C76F;
            --flutter-orange: #FF9F43;
            --flutter-red: #EA5455;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fafb;
        }
        
        .flutter-gradient {
            background: linear-gradient(135deg, var(--flutter-light-blue) 0%, var(--flutter-blue) 100%);
        }
        
        .section-card {
            border-left: 4px solid var(--flutter-blue);
            transition: all 0.3s ease;
        }
        
        .section-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .collapsible {
            cursor: pointer;
        }
        
        .skill-item {
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .skill-item:hover {
            border-left-color: var(--flutter-light-blue);
            background-color: rgba(2, 125, 253, 0.05);
        }
        
        .status-not-started {
            background-color: #f3f4f6;
            color: #6b7280;
            border-color: #e5e7eb;
        }
        
        .status-in-progress {
            background-color: #fffbeb;
            color: #d97706;
            border-color: #fbbf24;
        }
        
        .status-complete {
            background-color: #ecfdf5;
            color: #059669;
            border-color: #10b981;
        }
        
        .progress-container {
            background-color: #e5e7eb;
            border-radius: 9999px;
            height: 8px;
        }
        
        .progress-bar {
            background-color: var(--flutter-blue);
            height: 8px;
            border-radius: 9999px;
            transition: width 0.5s ease;
        }
        
        .priority-badge {
            font-size: 0.7rem;
            padding: 1px 6px;
            border-radius: 9999px;
        }
        
        .priority-required {
            background-color: #fee2e2;
            color: #dc2626;
        }
        
        .priority-optional {
            background-color: #e0e7ff;
            color: #4f46e5;
        }
        
        .skill-description {
            font-size: 0.875rem;
            color: #6b7280;
        }
        
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1;
            border-radius: 0.375rem;
        }
        
        .dropdown:hover .dropdown-content {
            display: block;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }
        
        .dropdown-item:hover {
            background-color: #f3f4f6;
        }
        
        @media print {
            .no-print {
                display: none;
            }
            
            .section-content {
                display: block !important;
            }
            
            body {
                background-color: white;
            }
        }

        /* Custom styling for status badges */
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            width: 100px;
            text-align: center;
        }
        
        /* Search highlight */
        .highlight {
            background-color: yellow;
        }
        
        /* Tooltip styles */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        /* Button styles */
        .btn {
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        /* For the chart */
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            max-width: 600px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--flutter-light-blue);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--flutter-blue);
        }
    </style>
</head>

                            { id: 'gdpr', name: 'GDPR & Data Privacy', description: 'Privacy regulations compliance', isRequired: true, status: 'Not Started' },
                            { id: 'secure-practices', name: 'Security Best Practices', description: 'Securing app and user data', isRequired: true, status: 'Not Started' }
                        ]
                    },
                    {
                        id: 'communication',
                        name: 'Communication & Stakeholders',
                        skills: [
                            { id: 'client-comms', name: 'Client Communication', description: 'Effective client interactions', isRequired: true, status: 'Not Started' },
                            { id: 'feedback-handling', name: 'Managing Feedback', description: 'Handling stakeholder feedback', isRequired: true, status: 'Not Started' }
                        ]
                    },
                    {
                        id: 'continuous-learning',
                        name: 'Continuous Learning & Community',
                        skills: [
                            { id: 'stay-updated', name: 'Staying Updated', description: 'Following Flutter developments', isRequired: true, status: 'Not Started' },
                            { id: 'community-engagement', name: 'Community Participation', description: 'Contributing to Flutter ecosystem', isRequired: true, status: 'Not Started' }
                        ]
                    },
                    {
                        id: 'freelance-career',
                        name: 'Freelancing & Career Growth',
                        skills: [
                            { id: 'portfolio', name: 'Portfolio Development', description: 'Building a strong project portfolio', isRequired: true, status: 'Not Started' },
                            { id: 'resume-cv', name: 'Resume & CV', description: 'Highlighting Flutter expertise', isRequired: true, status: 'Not Started' },
                            { id: 'interviews', name: 'Technical Interviews', description: 'Preparing for Flutter interviews', isRequired: true, status: 'Not Started' },
                            { id: 'freelancing', name: 'Freelancing Platforms', description: 'Working on freelance projects', isRequired: false, status: 'Not Started' },
                            { id: 'negotiation', name: 'Rate Negotiation', description: 'Setting appropriate rates', isRequired: false, status: 'Not Started' }
                        ]
                    },
                    {
                        id: 'optional-business',
                        name: 'Optional Business Topics',
                        skills: [
                            { id: 'monetization', name: 'App Monetization', description: 'Ads, in-app purchases, subscriptions', isRequired: false, status: 'Not Started' },
                            { id: 'marketing', name: 'App Marketing', description: 'Promoting your Flutter app', isRequired: false, status: 'Not Started' },
                            { id: 'legal', name: 'Legal Aspects', description: 'Contracts, terms of service, licensing', isRequired: false, status: 'Not Started' }
                        ]
                    }
                ]
            }
        ];

        // Document ready event
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the app
            initializeApp();
        });

        function initializeApp() {
            // Render the roadmap
            renderRoadmap();
            
            // Attach event listeners
            document.getElementById('search-input').addEventListener('input', searchSkills);
            document.getElementById('import-file').addEventListener('change', importProgress);

            // Initialize the chart
            updateChart();

            // Load progress from local storage
            loadProgress();
            
            // Update overall progress
            updateOverallProgress();
        }

        function renderRoadmap() {
            const roadmapContainer = document.getElementById('roadmap-container');
            roadmapContainer.innerHTML = '';

            roadmapData.forEach(part => {
                const partCard = document.createElement('div');
                partCard.className = 'mb-8 bg-white rounded-lg shadow-md overflow-hidden';
                
                // Part header
                const partHeader = document.createElement('div');
                partHeader.className = 'section-card p-4 bg-gray-50 cursor-pointer flex justify-between items-center';
                partHeader.innerHTML = `
                    <div class="flex-grow">
                        <h2 class="text-xl font-bold">${part.name}</h2>
                        <p class="text-sm text-gray-600 mt-1">${part.description}</p>
                    </div>
                    <div class="ml-4">
                        <div class="flex items-center">
                            <div class="progress-container w-40 mr-3">
                                <div id="progress-${part.id}" class="progress-bar" style="width: ${part.progress}%;"></div>
                            </div>
                            <span id="progress-text-${part.id}" class="text-sm font-medium">${part.progress}%</span>
                            <i class="fas fa-chevron-down ml-3 transform transition-transform duration-200"></i>
                        </div>
                    </div>
                `;
                partCard.appendChild(partHeader);
                
                // Part content (initially hidden)
                const partContent = document.createElement('div');
                partContent.className = 'section-content px-4 pb-4 hidden';
                partContent.id = `content-${part.id}`;
                
                // Add topics in part
                part.topics.forEach(topic => {
                    const topicSection = document.createElement('div');
                    topicSection.className = 'mt-4';
                    
                    const topicHeader = document.createElement('h3');
                    topicHeader.className = 'text-lg font-semibold mb-2 text-gray-800';
                    topicHeader.textContent = topic.name;
                    topicSection.appendChild(topicHeader);
                    
                    // Add skills in topic
                    topic.skills.forEach(skill => {
                        const skillItem = document.createElement('div');
                        skillItem.className = 'skill-item flex flex-col md:flex-row justify-between p-3 bg-white rounded-lg mb-2 border hover:shadow-sm';
                        skillItem.id = `skill-${skill.id}`;
                        
                        const priorityBadge = skill.isRequired 
                            ? '<span class="priority-badge priority-required">Must Learn</span>' 
                            : '<span class="priority-badge priority-optional">Optional</span>';
                        
                        skillItem.innerHTML = `
                            <div class="flex-grow mb-2 md:mb-0">
                                <div class="flex items-center mb-1">
                                    <span class="font-medium">${skill.name}</span>
                                    ${priorityBadge}
                                </div>
                                <p class="skill-description text-sm">${skill.description}</p>
                            </div>
                            <div class="flex items-center">
                                <div class="dropdown">
                                    <div id="status-${skill.id}" class="status-badge ${getStatusClass(skill.status)} cursor-pointer">${skill.status}</div>
                                    <div class="dropdown-content">
                                        <div class="dropdown-item" onclick="changeStatus('${skill.id}', 'Not Started')">Not Started</div>
                                        <div class="dropdown-item" onclick="changeStatus('${skill.id}', 'In Progress')">In Progress</div>
                                        <div class="dropdown-item" onclick="changeStatus('${skill.id}', 'Complete')">Complete</div>
                                    </div>
                                </div>
                            </div>
                        `;
                        topicSection.appendChild(skillItem);
                    });
                    
                    partContent.appendChild(topicSection);
                });
                
                partCard.appendChild(partContent);
                roadmapContainer.appendChild(partCard);

                // Add click event to toggle visibility
                partHeader.addEventListener('click', function() {
                    const content = partContent;
                    const chevron = this.querySelector('.fa-chevron-down');
                    
                    if (content.classList.contains('hidden')) {
                        content.classList.remove('hidden');
                        chevron.classList.add('rotate-180');
                    } else {
                        content.classList.add('hidden');
                        chevron.classList.remove('rotate-180');
                    }
                });
            });

            // Count total skills
            updateSkillCounters();
        }

        function changeStatus(skillId, newStatus) {
            // Find the skill in roadmap data
            for (const part of roadmapData) {
                for (const topic of part.topics) {
                    for (const skill of topic.skills) {
                        if (skill.id === skillId) {
                            skill.status = newStatus;
                            
                            // Update the UI
                            const statusElement = document.getElementById(`status-${skillId}`);
                            statusElement.textContent = newStatus;
                            statusElement.className = `status-badge ${getStatusClass(newStatus)} cursor-pointer`;
                            
                            // Update progress
                            updatePartProgress(part);
                            updateSkillCounters();
                            updateOverallProgress();
                            updateChart();
                            saveProgress();
                            break;
                        }
                    }
                }
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'Complete':
                    return 'status-complete';
                case 'In Progress':
                    return 'status-in-progress';
                case 'Not Started':
                default:
                    return 'status-not-started';
            }
        }

        function updatePartProgress(part) {
            // Count skills
            let totalSkills = 0;
            let completedSkills = 0;
            
            for (const topic of part.topics) {
                for (const skill of topic.skills) {
                    if (skill.isRequired) {  // Only count required skills for progress
                        totalSkills++;
                        if (skill.status === 'Complete') {
                            completedSkills++;
                        }
                    }
                }
            }
            
            // Calculate progress percentage
            const progressPercent = totalSkills > 0 ? Math.round((completedSkills / totalSkills) * 100) : 0;
            part.progress = progressPercent;
            
            // Update UI
            const progressBar = document.getElementById(`progress-${part.id}`);
            const progressText = document.getElementById(`progress-text-${part.id}`);
            
            if (progressBar && progressText) {
                progressBar.style.width = `${progressPercent}%`;
                progressText.textContent = `${progressPercent}%`;
            }
        }

        function updateOverallProgress() {
            // Count skills across all parts
            let totalRequiredSkills = 0;
            let completedRequiredSkills = 0;
            
            for (const part of roadmapData) {
                for (const topic of part.topics) {
                    for (const skill of topic.skills) {
                        if (skill.isRequired) {  // Only count required skills
                            totalRequiredSkills++;
                            if (skill.status === 'Complete') {
                                completedRequiredSkills++;
                            }
                        }
                    }
                }
            }
            
            // Calculate progress percentage
            const progressPercent = totalRequiredSkills > 0 ? Math.round((completedRequiredSkills / totalRequiredSkills) * 100) : 0;
            
            // Update UI
            const progressBar = document.getElementById('overall-progress-bar');
            const progressText = document.getElementById('overall-progress-text');
            
            if (progressBar && progressText) {
                progressBar.style.width = `${progressPercent}%`;
                progressText.textContent = `${progressPercent}%`;
            }
        }

        function updateSkillCounters() {
            let totalSkills = 0;
            let completedSkills = 0;
            let inProgressSkills = 0;
            let notStartedSkills = 0;
            
            for (const part of roadmapData) {
                for (const topic of part.topics) {
                    for (const skill of topic.skills) {
                        totalSkills++;
                        
                        switch (skill.status) {
                            case 'Complete':
                                completedSkills++;
                                break;
                            case 'In Progress':
                                inProgressSkills++;
                                break;
                            case 'Not Started':
                            default:
                                notStartedSkills++;
                                break;
                        }
                    }
                }
            }
            
            // Update UI
            document.getElementById('total-skills').textContent = totalSkills;
            document.getElementById('completed-skills').textContent = completedSkills;
            document.getElementById('in-progress-skills').textContent = inProgressSkills;
            document.getElementById('not-started-skills').textContent = notStartedSkills;
        }

        function saveProgress() {
            // Create a simplified version of the data for storage
            const progressData = roadmapData.map(part => {
                return {
                    id: part.id,
                    topics: part.topics.map(topic => {
                        return {
                            id: topic.id,
                            skills: topic.skills.map(skill => {
                                return {
                                    id: skill.id,
                                    status: skill.status
                                };
                            })
                        };
                    })
                };
            });
            
            // Save to local storage
            localStorage.setItem('flutterRoadmapProgress', JSON.stringify(progressData));
        }

        function loadProgress() {
            const savedProgress = localStorage.getItem('flutterRoadmapProgress');
            
            if (savedProgress) {
                try {
                    const progressData = JSON.parse(savedProgress);
                    
                    // Update our roadmap data with saved statuses
                    progressData.forEach(savedPart => {
                        const part = roadmapData.find(p => p.id === savedPart.id);
                        
                        if (part) {
                            savedPart.topics.forEach(savedTopic => {
                                const topic = part.topics.find(t => t.id === savedTopic.id);
                                
                                if (topic) {
                                    savedTopic.skills.forEach(savedSkill => {
                                        const skill = topic.skills.find(s => s.id === savedSkill.id);
                                        
                                        if (skill) {
                                            skill.status = savedSkill.status;
                                            
                                            // Update UI
                                            const statusElement = document.getElementById(`status-${skill.id}`);
                                            if (statusElement) {
                                                statusElement.textContent = skill.status;
                                                statusElement.className = `status-badge ${getStatusClass(skill.status)} cursor-pointer`;
                                            }
                                        }
                                    });
                                }
                            });
                            
                            // Update progress for this part
                            updatePartProgress(part);
                        }
                    });
                    
                    // Update overall progress
                    updateSkillCounters();
                    updateOverallProgress();
                    updateChart();
                } catch (error) {
                    console.error('Error loading progress:', error);
                }
            }
        }

        function exportProgress() {
            // Create a simplified version of the data for export
            const progressData = roadmapData.map(part => {
                return {
                    id: part.id,
                    name: part.name,
                    progress: part.progress,
                    topics: part.topics.map(topic => {
                        return {
                            id: topic.id,
                            name: topic.name,
                            skills: topic.skills.map(skill => {
                                return {
                                    id: skill.id,
                                    name: skill.name,
                                    status: skill.status,
                                    isRequired: skill.isRequired
                                };
                            })
                        };
                    })
                };
            });
            
            // Create file and download
            const dataStr = JSON.stringify(progressData);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            
            const exportFileDefaultName = 'flutter_roadmap_progress.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function importProgress(event) {
            const file = event.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const progressData = JSON.parse(e.target.result);
                        
                        // Update our roadmap data with imported statuses
                        progressData.forEach(importedPart => {
                            const part = roadmapData.find(p => p.id === importedPart.id);
                            
                            if (part) {
                                importedPart.topics.forEach(importedTopic => {
                                    const topic = part.topics.find(t => t.id === importedTopic.id);
                                    
                                    if (topic) {
                                        importedTopic.skills.forEach(importedSkill => {
                                            const skill = topic.skills.find(s => s.id === importedSkill.id);
                                            
                                            if (skill) {
                                                skill.status = importedSkill.status;
                                                
                                                // Update UI
                                                const statusElement = document.getElementById(`status-${skill.id}`);
                                                if (statusElement) {
                                                    statusElement.textContent = skill.status;
                                                    statusElement.className = `status-badge ${getStatusClass(skill.status)} cursor-pointer`;
                                                }
                                            }
                                        });
                                    }
                                });
                                
                                // Update progress for this part
                                updatePartProgress(part);
                            }
                        });
                        
                        // Update overall progress
                        updateSkillCounters();
                        updateOverallProgress();
                        updateChart();
                        saveProgress();
                        
                        alert('Progress imported successfully!');
                    } catch (error) {
                        console.error('Error importing progress:', error);
                        alert('Error importing progress. Please check the file format.');
                    }
                };
                
                reader.readAsText(file);
            }
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                // Reset all skills to "Not Started"
                for (const part of roadmapData) {
                    for (const topic of part.topics) {
                        for (const skill of topic.skills) {
                            skill.status = 'Not Started';
                            
                            // Update UI
                            const statusElement = document.getElementById(`status-${skill.id}`);
                            if (statusElement) {
                                statusElement.textContent = 'Not Started';
                                statusElement.className = 'status-badge status-not-started cursor-pointer';
                            }
                        }
                    }
                    
                    // Update progress for this part
                    updatePartProgress(part);
                }
                
                // Update overall progress
                updateSkillCounters();
                updateOverallProgress();
                updateChart();
                saveProgress();
                
                alert('Progress has been reset.');
            }
        }

        function searchSkills() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            // Remove existing highlights
            document.querySelectorAll('.highlight').forEach(el => {
                el.outerHTML = el.innerHTML;
            });
            
            if (searchTerm.length < 2) {
                // Reset search if term is too short
                document.querySelectorAll('.skill-item').forEach(item => {
                    item.style.display = 'flex';
                });
                return;
            }
            
            let foundAny = false;
            
            // Search through skills
            for (const part of roadmapData) {
                let foundInPart = false;
                
                for (const topic of part.topics) {
                    let foundInTopic = false;
                    
                    for (const skill of topic.skills) {
                        const skillElement = document.getElementById(`skill-${skill.id}`);
                        
                        if (!skillElement) continue;
                        
                        // Search in skill name and description
                        const nameMatches = skill.name.toLowerCase().includes(searchTerm);
                        const descMatches = skill.description.toLowerCase().includes(searchTerm);
                        
                        if (nameMatches || descMatches) {
                            skillElement.style.display = 'flex';
                            foundInTopic = true;
                            foundInPart = true;
                            foundAny = true;
                            
                            // Highlight matching text
                            if (nameMatches) {
                                const nameEl = skillElement.querySelector('.font-medium');
                                nameEl.innerHTML = highlightText(nameEl.textContent, searchTerm);
                            }
                            
                            if (descMatches) {
                                const descEl = skillElement.querySelector('.skill-description');
                                descEl.innerHTML = highlightText(descEl.textContent, searchTerm);
                            }
                        } else {
                            skillElement.style.display = 'none';
                        }
                    }
                }
                
                // Expand part if it contains matches
                if (foundInPart) {
                    const contentElement = document.getElementById(`content-${part.id}`);
                    const headerElement = contentElement.previousElementSibling;
                    const chevron = headerElement.querySelector('.fa-chevron-down');
                    
                    contentElement.classList.remove('hidden');
                    chevron.classList.add('rotate-180');
                }
            }
            
            if (!foundAny) {
                // No matches found
                alert('No skills found matching your search.');
            }
        }

        function highlightText(text, term) {
            const regex = new RegExp(`(${term})`, 'gi');
            return text.replace(regex, '<span class="highlight bg-yellow-200">$1</span>');
        }

        function expandAll() {
            document.querySelectorAll('.section-content').forEach(content => {
                content.classList.remove('hidden');
                const header = content.previousElementSibling;
                const chevron = header.querySelector('.fa-chevron-down');
                chevron.classList.add('rotate-180');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.section-content').forEach(content => {
                content.classList.add('hidden');
                const header = content.previousElementSibling;
                const chevron = header.querySelector('.fa-chevron-down');
                chevron.classList.remove('rotate-180');
            });
        }

        let progressChart = null;

        function updateChart() {
            const ctx = document.getElementById('progress-chart').getContext('2d');
            
            // Prepare data for chart
            const labels = roadmapData.map(part => part.name.split(':')[1].trim());
            const progressData = roadmapData.map(part => part.progress);
            
            // If chart exists, update it
            if (progressChart) {
                progressChart.data.labels = labels;
                progressChart.data.datasets[0].data = progressData;
                progressChart.update();
                return;
            }
            
            // Create new chart
            progressChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Progress (%)',
                        data: progressData,
                        backgroundColor: [
                            'rgba(5, 83, 177, 0.7)',  // Flutter blue
                            'rgba(2, 125, 253, 0.7)', // Flutter light blue
                            'rgba(255, 222, 89, 0.7)', // Flutter yellow
                            'rgba(40, 199, 111, 0.7)', // Flutter green
                            'rgba(255, 159, 67, 0.7)', // Flutter orange
                            'rgba(234, 84, 85, 0.7)',  // Flutter red
                            'rgba(78, 81, 171, 0.7)',  // Additional colors
                            'rgba(50, 120, 200, 0.7)',
                            'rgba(106, 27, 154, 0.7)',
                            'rgba(220, 53, 69, 0.7)'
                        ],
                        borderColor: [
                            'rgb(5, 83, 177)',
                            'rgb(2, 125, 253)',
                            'rgb(255, 222, 89)',
                            'rgb(40, 199, 111)',
                            'rgb(255, 159, 67)',
                            'rgb(234, 84, 85)',
                            'rgb(78, 81, 171)',
                            'rgb(50, 120, 200)',
                            'rgb(106, 27, 154)',
                            'rgb(220, 53, 69)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        },
                        x: {
                            ticks: {
                                callback: function(value) {
                                    // Shorter labels for mobile
                                    const label = this.getLabelForValue(value);
                                    return label.substring(0, 10) + (label.length > 10 ? '...' : '');
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.raw + '%';
                                },
                                title: function(context) {
                                    return roadmapData[context[0].dataIndex].name;
                                }
                            }
                        },
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
